@if (user(); as currentUser) {
  @if (currentUser.role === Role.Admin) {
    <section class="row">
      <div class="liste">
        <app-users-list
          [me]="currentUser"
          [users]="users()"
          [cursor]="cursor"
          (cursorChange)="select($event)"
          (add)="add()"
        />
      </div>

      <section class="panneau sm">
        @if (creatingUser) {
          <app-user-form
            [admin]="true"
            [isNew]="true"
            (save)="save($event)"
          />
        } @else if (selectedUser; as selected) {
          <app-user-form
            [user]="selected"
            [admin]="true"
            [canDelete]="cursor !== null"
            (save)="save($event)"
            (delete)="deleteSelected()"
          />
        }
      </section>
    </section>
  }
}
