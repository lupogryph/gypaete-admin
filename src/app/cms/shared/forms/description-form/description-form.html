<mat-form-field appearance="outline">
  <mat-label>Description (français)</mat-label>
  <textarea matInput [formField]="descriptionForm.fr"></textarea>
</mat-form-field>
@if (hasEnglish()) {
  <mat-form-field appearance="outline">
    <mat-label>Description (anglais)</mat-label>
    <textarea matInput [formField]="descriptionForm.en"></textarea>
  </mat-form-field>
}
<div class="actions">
  <button
    type="button"
    mat-icon-button
    (click)="addEn()"
    [disabled]="translating"
    color="primary"
  ><mat-icon>translate</mat-icon>
  </button>
  @if (hasEnglish()) {
  <button
    type="button"
    mat-icon-button
    (click)="deleteEn()"
    ><mat-icon>subtitles_off</mat-icon></button>
  }
  @if (translationError) {
    <p role="alert">{{ translationError }}</p>
  }
</div>
