<h2 mat-dialog-title>Ajouter des photos</h2>
<mat-dialog-content>
  <input
    #fileInput
    class="file-input"
    type="file"
    accept="image/*"
    multiple
    (change)="selectFiles($event)"
  />
  <button mat-stroked-button type="button" (click)="fileInput.click()">
    <mat-icon>folder_open</mat-icon> Choisir des images
  </button>
  @if (files().length > 0) {
    <p>{{ files().length }} image(s) sélectionnée(s)</p>
  }

  <mat-form-field appearance="outline" class="url-field">
    <mat-label>URL HTTP ou HTTPS d’une image</mat-label>
    <input matInput type="url" [value]="url()" (input)="updateUrl($event)" />
  </mat-form-field>

  @if (errorMessage) {
    <p class="error-message" role="alert">{{ errorMessage }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Annuler</button>
  <button mat-flat-button type="button" (click)="submit()">Envoyer</button>
</mat-dialog-actions>
