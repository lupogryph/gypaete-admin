<div class="lit-layout">
  <table mat-table [dataSource]="formArray.controls" class="table">
  <ng-container matColumnDef="lit">
    <th mat-header-cell *matHeaderCellDef>Lit</th>
    <td mat-cell *matCellDef="let row" [formGroup]="row">
      <mat-form-field appearance="outline">
        <mat-label>Lit</mat-label>
        <mat-select
          formControlName="litId"
          (selectionChange)="selectLit(row, $event.value)"
        >
          @for (lit of availableLits(); track lit.id) {
            <mat-option [value]="lit.id">{{ lit.classe }} ({{ lit.largeur }} cm)</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let row" [formGroup]="row">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput type="number" min="1" formControlName="nombre">
      </mat-form-field>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row; let i = index">
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'Supprimer la ligne de lit ' + (i + 1)"
        (click)="remove(i)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="add">
    <td mat-footer-cell *matFooterCellDef [attr.colspan]="columns.length">
      <button mat-stroked-button type="button" (click)="add()">
        <mat-icon>add</mat-icon>
        Ajouter un lit
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
  <tr mat-footer-row *matFooterRowDef="['add']"></tr>
  </table>
  <aside class="lit-store">
    <app-lit-store [(lits)]="availableLits"></app-lit-store>
  </aside>
</div>
