<mat-toolbar class="toolbar">
  <mat-form-field appearance="outline">
    <mat-select
      [value]="selectedChambre()"
      (selectionChange)="select($event.value)"
    >
      @for (chambre of chambres(); track chambre.numero) {
        <mat-option [value]="chambre.numero">Chambre {{ chambre.numero }}</mat-option>
      }
      <mat-option [value]="-1"><mat-icon>add</mat-icon>{{ selectedChambre() === -1 ? 'Création...' : 'Créer'}}</mat-option>
    </mat-select>
  </mat-form-field>
  <button
    matButton="outlined"
    type="button"
    [disabled]="saving"
    (click)="save()"
  >
    <mat-icon>save</mat-icon>
    Sauvegarder
  </button>

  {{ selectedChambre() }}
</mat-toolbar>

@if (selectedChambre() > -2) {
  <app-chambre-dashboard [numero]="selectedChambre()"></app-chambre-dashboard>
}
