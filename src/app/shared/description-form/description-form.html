<mat-form-field appearance="fill">
  <mat-label>Description (français)</mat-label>
  <textarea matInput [formField]="descriptionForm.fr"></textarea>
</mat-form-field>
@if (hasEnglish()) {
  <mat-form-field appearance="fill">
    <mat-label>Description (anglais)</mat-label>
    <textarea matInput [formField]="descriptionForm.en"></textarea>
  </mat-form-field>
}
<div>
  <button
    type="button"
    mat-button
    mat-stroked-button
    (click)="addEn()"
    [disabled]="translating"
    color="primary"
  ><mat-icon>translate</mat-icon> Traduire
  </button>
  @if (translationError) {
    <p role="alert">{{ translationError }}</p>
  }
</div>
