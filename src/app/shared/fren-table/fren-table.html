<table
  mat-table
  [dataSource]="frensArray.controls"
  class="fren-table"
>
  <ng-container matColumnDef="fren">
    <th mat-header-cell *matHeaderCellDef>Traduction</th>
    <td mat-cell *matCellDef="let row">
      <div class="fren-cell">
        <div class="fren-fields">
          <mat-form-field appearance="outline">
            <mat-label>Français</mat-label>
            <input matInput [formControl]="row.controls.fr"/>
          </mat-form-field>
          @if (row.controls.hasEnglish.value) {
            <mat-form-field appearance="outline">
              <mat-label>Anglais</mat-label>
              <input matInput [formControl]="row.controls.en"/>
            </mat-form-field>
          }
        </div>
        <button
          type="button"
          matIconButton
          [attr.aria-label]="'Traduire en anglais'"
          (click)="addEn(row)"
          [disabled]="row.controls.translating.value"
          color="primary"
        ><mat-icon>translate</mat-icon>
        </button>
        @if (row.controls.hasEnglish.value) {
          <button
            type="button"
            mat-icon-button
            aria-label="Supprimer la traduction anglaise"
            (click)="deleteEn(row)"
          ><mat-icon>subtitles_off</mat-icon></button>
        }
      </div>
      @if (row.controls.translationError.value) {
        <p role="alert">{{ row.controls.translationError.value }}</p>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row; let i = index">
      <button
        matIconButton
        type="button"
        [attr.aria-label]="'Supprimer la traduction ' + (i + 1)"
        (click)="remove(i)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="add">
    <td mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
      <button mat-stroked-button type="button" (click)="add()">
        <mat-icon>add</mat-icon>
        Ajouter une traduction
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  <tr mat-footer-row *matFooterRowDef="['add']"></tr>
</table>
