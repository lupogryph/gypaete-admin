<mat-toolbar class="toolbar">
  <span class="title">Chalet</span>
  <button
    mat-flat-button
    class="save-button"
    type="button"
    [disabled]="saving"
    (click)="save()"
  >
    <mat-icon>save</mat-icon>
    Sauvegarder
  </button>
</mat-toolbar>

<div class="dash-layout">
  <mat-list class="dash-navigation" aria-label="Sections du chalet">
    @for (item of dashList; track item.id) {
      <mat-list-item
        matRipple
        [class.selected]="activeSection === item.id"
        [attr.aria-current]="activeSection === item.id ? 'page' : null"
        (click)="activeSection = item.id"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <div matListItemTitle>{{ item.label }}</div>
      </mat-list-item>
    }
  </mat-list>

  <section class="dash-content">
    @switch (activeSection) {
      @case ('description') {
        <app-description-form
          [description]="description()"
          (descriptionChange)="updateDescription($event)"
        ></app-description-form>
      }
      @case ('gallerie') {
        <app-gallery
          [photos]="chalet().photos"
          (uploadRequested)="uploadPhotos($event)"
          (deletePhotos)="deletePhotos($event)"
        ></app-gallery>
      }
      @case ('general') {
        <section class="form-section">
          <mat-form-field appearance="outline" class="field">
            <mat-label>Nom du chalet</mat-label>
            <input matInput [formField]="generalForm.nom" autocomplete="off"/>
          </mat-form-field>
        </section>
        <div class="separation"></div>
        <section class="form-section">
          <mat-form-field appearance="outline" class="field">
            <mat-label>Nombre de personnes de base</mat-label>
            <input
              matInput
              type="number"
              [formField]="generalForm.nombrePersonnesBase"
            />
          </mat-form-field>
        </section>
        <section class="form-section">
          <mat-slide-toggle [formField]="generalForm.animauxAutorises">
            <mat-icon>pets</mat-icon>
            Animaux autorisés
          </mat-slide-toggle>
        </section>
      }
    }
  </section>
</div>
